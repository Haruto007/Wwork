<style>
:root {
  --primary:    #3B5BDB;
  --primary-dk: #2F4AC4;
  --accent:     #339AF0;
  --success:    #40C057;
  --warning:    #FAB005;
  --danger:     #FA5252;
  --gray-1:     #F8F9FA;
  --gray-2:     #E9ECEF;
  --gray-3:     #DEE2E6;
  --gray-5:     #ADB5BD;
  --gray-7:     #495057;
  --gray-9:     #212529;
  --sidebar-w:  220px;
  --radius:     8px;
  --shadow:     0 1px 4px rgba(0,0,0,.10);
  --shadow-md:  0 4px 12px rgba(0,0,0,.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  font-size: 14px;
  color: var(--gray-9);
  background: var(--gray-1);
  height: 100vh;
  overflow: hidden;
}

/* Layout */
#app { display: flex; height: 100vh; }

#sidebar {
  width: var(--sidebar-w);
  background: #1e2a4a;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar-header {
  padding: 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.sidebar-logo {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .05em;
}

.nav-list { list-style: none; padding: 8px 0; }
.nav-list li { margin: 2px 8px; }
.nav-item {
  display: block;
  width: 100%;
  padding: 10px 14px;
  background: none;
  border: none;
  border-radius: var(--radius);
  color: rgba(255,255,255,.7);
  font-size: 13.5px;
  text-align: left;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.nav-item:hover  { background: rgba(255,255,255,.1); color: #fff; }
.nav-item.active { background: var(--primary); color: #fff; }

#main {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* Cards */
.card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--gray-7);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--gray-2);
}

/* Stat cards grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.stat-card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  text-align: center;
}
.stat-label { font-size: 11px; color: var(--gray-5); text-transform: uppercase; letter-spacing: .05em; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--gray-9); margin: 4px 0; }
.stat-sub   { font-size: 11px; color: var(--gray-5); }
.stat-card.highlight .stat-value { color: var(--primary); }
.stat-card.success   .stat-value { color: var(--success); }
.stat-card.warning   .stat-value { color: var(--warning); }
.stat-card.danger    .stat-value { color: var(--danger); }

/* Progress bar */
.progress-wrap { margin-top: 8px; }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--gray-5); margin-bottom: 4px; }
.progress-bar { height: 8px; background: var(--gray-2); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .4s; }
.progress-fill.over { background: var(--success); }

/* Page header */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.page-title { font-size: 20px; font-weight: 700; }
.breadcrumb { font-size: 12px; color: var(--gray-5); margin-bottom: 4px; }
.breadcrumb span { cursor: pointer; color: var(--primary); }
.breadcrumb span:hover { text-decoration: underline; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity .15s, box-shadow .15s;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dk); opacity: 1; }
.btn-secondary { background: var(--gray-2); color: var(--gray-7); }
.btn-danger  { background: var(--danger);  color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 6px 8px; font-size: 13px; }

/* Filters bar */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.filter-bar input,
.filter-bar select {
  padding: 7px 10px;
  border: 1px solid var(--gray-3);
  border-radius: var(--radius);
  font-size: 13px;
  background: #fff;
  min-width: 120px;
}
.filter-bar input { min-width: 200px; }

/* Status tabs */
.tab-bar {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  border-bottom: 2px solid var(--gray-2);
  overflow-x: auto;
}
.tab {
  padding: 8px 18px;
  border: none;
  background: none;
  font-size: 13px;
  color: var(--gray-5);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: color .15s;
}
.tab:hover { color: var(--gray-7); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab-count {
  display: inline-block;
  background: var(--gray-2);
  color: var(--gray-7);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 4px;
}
.tab.active .tab-count { background: var(--primary); color: #fff; }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
thead th {
  padding: 10px 12px;
  text-align: left;
  background: var(--gray-1);
  border-bottom: 2px solid var(--gray-3);
  color: var(--gray-7);
  font-weight: 600;
  white-space: nowrap;
  user-select: none;
}
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { background: var(--gray-2); }
thead th.sort-asc::after  { content: ' \2191'; color: var(--primary); }
thead th.sort-desc::after { content: ' \2193'; color: var(--primary); }
tbody td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--gray-2);
  vertical-align: middle;
}
tbody tr:hover { background: var(--gray-1); }
.clickable-row { cursor: pointer; }
.text-right { text-align: right; }
.text-center { text-align: center; }
.text-muted { color: var(--gray-5); }
.text-ellipsis { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Status badges */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-stay    { background: #D0EBFF; color: #1971C2; }
.badge-done    { background: #D3F9D8; color: #2B8A3E; }
.badge-reject  { background: #FFE3E3; color: #C92A2A; }
.badge-decline { background: #FFF3BF; color: #E67700; }
.badge-none    { background: var(--gray-2); color: var(--gray-7); }
.badge-proposal{ background: #E5DBFF; color: #5F3DC4; }

/* Forms */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 600; color: var(--gray-7); }
.form-label.required::after { content: ' *'; color: var(--danger); }
.form-control {
  padding: 8px 10px;
  border: 1px solid var(--gray-3);
  border-radius: var(--radius);
  font-size: 13px;
  background: #fff;
  transition: border-color .15s;
}
.form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,91,219,.12); }
.form-control[readonly] { background: var(--gray-1); color: var(--gray-5); }
textarea.form-control { resize: vertical; min-height: 80px; }
.form-hint { font-size: 11px; color: var(--gray-5); }
.form-error { font-size: 11px; color: var(--danger); display: none; }
.form-control.invalid { border-color: var(--danger); }
.form-control.invalid + .form-error { display: block; }
.form-actions { display: flex; gap: 8px; margin-top: 20px; }

/* Detail view */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.detail-item { padding: 12px 0; border-bottom: 1px solid var(--gray-2); }
.detail-label { font-size: 11px; color: var(--gray-5); margin-bottom: 3px; }
.detail-value { font-size: 13px; color: var(--gray-9); word-break: break-all; }
.detail-item.full { grid-column: 1 / -1; }

/* Charts */
.chart-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.chart-container { position: relative; height: 260px; }

/* Loading */
#loading-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px;
  border-radius: var(--radius);
  color: #fff;
  font-size: 13px;
  box-shadow: var(--shadow-md);
  animation: slideIn .25s ease;
  min-width: 220px;
  max-width: 360px;
}
.toast-success { background: var(--success); }
.toast-error   { background: var(--danger); }
.toast-info    { background: var(--primary); }
@keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Modal */
#modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 1500;
}
#modal {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 24px;
  max-width: 480px;
  width: 90%;
}
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
.modal-body  { font-size: 13px; color: var(--gray-7); margin-bottom: 20px; line-height: 1.6; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* Utility */
.empty-state { text-align: center; padding: 48px 0; color: var(--gray-5); font-size: 14px; }
.link-cell a { color: var(--accent); text-decoration: none; word-break: break-all; }
.link-cell a:hover { text-decoration: underline; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Responsive */
@media (max-width: 768px) {
  #sidebar { width: 56px; }
  .sidebar-logo { display: none; }
  .nav-item { font-size: 0; padding: 12px; text-align: center; }
  .nav-item::first-letter { font-size: 16px; }
  #main { padding: 12px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-group.full { grid-column: 1; }
  .chart-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .detail-grid { grid-template-columns: 1fr; }
}
</style>
